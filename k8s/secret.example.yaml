# =============================================================================
# COMPLETE secret template for VPS (devops-lab namespace)
#
# 1. Copy to secret.yaml (never commit secret.yaml):
#      cp secret.example.yaml secret.yaml
# 2. Replace every REPLACE_* value (same password in POSTGRES_PASSWORD + DATABASE_URL)
# 3. Apply on VPS:
#      kubectl apply -f /opt/devops-runtime/k8s/secret.yaml
#
# Public site:  https://school.72-62-250-194.sslip.io
# Local DB tool: postgresql://postgres:REPLACE_POSTGRES_PASSWORD@72.62.250.194:30432/school_db
# =============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: school-domnak-secrets
  namespace: devops-lab
type: Opaque
stringData:
  # --- App ---
  APP_NAME: School Registration System
  APP_ENV: production
  APP_DEBUG: "false"
  SECRET_KEY: REPLACE_WITH_openssl_rand_hex_32

  # --- PostgreSQL (postgres pod reads these three keys) ---
  POSTGRES_DB: school_db
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: REPLACE_POSTGRES_PASSWORD

  # --- Backend DB connection (inside K3s — host must be "postgres") ---
  # Password MUST match POSTGRES_PASSWORD above
  DATABASE_URL: postgresql+psycopg2://postgres:REPLACE_POSTGRES_PASSWORD@postgres:5432/school_db

  # --- Redis / Celery ---
  REDIS_URL: redis://redis:6379/0
  CELERY_BROKER_URL: redis://redis:6379/0
  CELERY_RESULT_BACKEND: redis://redis:6379/1
  USE_CELERY_TASKS: "false"
  CELERY_BEAT_HANDLES_SCHEDULES: "false"
  RUN_DB_MIGRATIONS: "true"

  # --- CORS (HTTPS domain + optional raw IP) ---
  BACKEND_CORS_ORIGINS: https://school.72-62-250-194.sslip.io,http://72.62.250.194,https://72.62.250.194

  # --- Uploads ---
  UPLOAD_DIR: /app/uploads

  # --- Telegram (optional — leave empty to disable) ---
  TELEGRAM_BOT_TOKEN: ""
  TELEGRAM_CHAT_ID: ""
  TELEGRAM_WEBHOOK_SECRET: ""
  TELEGRAM_USE_POLLING: "true"
  TELEGRAM_ACTIVITY_ALERTS_ENABLED: "true"

  # --- Google Sheets backup ---
  # 1. Share your spreadsheet with Editor access:
  #    school-domnak@school-domnak.iam.gserviceaccount.com
  # 2. Create K8s secret from JSON (on VPS):
  #    /opt/devops-runtime/scripts/setup-google-sheets-secret.sh /path/to/json
  GOOGLE_SHEETS_BACKUP_ENABLED: "true"
  GOOGLE_SHEETS_CREDENTIALS_FILE: /app/secrets/google-sheets-service-account.json
  GOOGLE_SHEETS_SPREADSHEET_ID: REPLACE_WITH_SPREADSHEET_ID
  BACKUP_SCHEDULE_HOUR: "19"
  BACKUP_SCHEDULE_MINUTE: "0"
  BACKUP_TIMEZONE: Asia/Phnom_Penh
