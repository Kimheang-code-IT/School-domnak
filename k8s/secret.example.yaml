# Example only — do NOT commit real secrets.
# Copy values and create the secret manually on EC2 (see docs/k3s-setup.md).
apiVersion: v1
kind: Secret
metadata:
  name: school-domnak-secrets
  namespace: school-domnak
type: Opaque
stringData:
  APP_ENV: production
  SECRET_KEY: change-this-secret
  POSTGRES_PASSWORD: postgres
  DATABASE_URL: postgresql+psycopg2://postgres:postgres@postgres:5432/school_db
  REDIS_URL: redis://redis:6379/0
  CELERY_BROKER_URL: redis://redis:6379/0
  CELERY_RESULT_BACKEND: redis://redis:6379/1
  NUXT_PUBLIC_API_BASE: http://EC2_PUBLIC_IP:30080/api/v1
  NUXT_PUBLIC_USE_BACKEND_API: "true"
