# K3s Service — NodePort so Ubuntu host nginx can proxy to the pod
apiVersion: v1
kind: Service
metadata:
  name: devops-app
  namespace: devops-lab
  labels:
    app: devops-app
spec:
  type: NodePort
  selector:
    app: devops-app
  ports:
    - name: http
      port: 80
      targetPort: 3000
      nodePort: 30000
      protocol: TCP
