apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: school-domnak
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: school-frontend:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 3000
          envFrom:
            - secretRef:
                name: school-domnak-secrets
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: school-domnak
spec:
  type: NodePort
  selector:
    app: frontend
  ports:
    - port: 3000
      targetPort: 3000
      nodePort: 30000
