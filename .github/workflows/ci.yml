name: CI

on:
  push:
  pull_request:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend — test & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.30.3

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: Frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test

      - name: Build
        run: pnpm build
        env:
          NUXT_PUBLIC_API_BASE: http://localhost:8000/api/v1
          NUXT_PUBLIC_USE_BACKEND_API: "true"

  backend:
    name: Backend — migrate & smoke test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: school_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d school_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      APP_ENV: test
      SECRET_KEY: ci-test-secret-key-not-for-production
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/school_db
      REDIS_URL: redis://localhost:6379/0
      CELERY_BROKER_URL: redis://localhost:6379/0
      CELERY_RESULT_BACKEND: redis://localhost:6379/1
      USE_CELERY_TASKS: "false"
      CELERY_BEAT_HANDLES_SCHEDULES: "true"
      GOOGLE_SHEETS_BACKUP_ENABLED: "false"
      TELEGRAM_USE_POLLING: "false"
      TELEGRAM_BOT_TOKEN: ""
      UPLOAD_DIR: uploads

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Prepare runtime directories
        run: mkdir -p uploads

      - name: Run database migrations
        run: alembic upgrade head

      - name: Python syntax check
        run: python -m compileall -q app

      - name: Smoke test /health endpoint
        run: |
          python - <<'PY'
          from fastapi.testclient import TestClient

          from app.main import app

          client = TestClient(app)
          response = client.get("/health")
          assert response.status_code == 200, response.text
          assert response.json() == {"status": "ok"}
          print("Health check OK")
          PY

  docker:
    name: Docker — build images
    runs-on: ubuntu-latest
    needs: [frontend, backend]

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build backend image
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          push: false
          provenance: false
          tags: school-backend:ci
          cache-from: type=gha

      - name: Build frontend image
        uses: docker/build-push-action@v7
        with:
          context: ./Frontend
          target: runtime
          push: false
          provenance: false
          tags: school-frontend:ci
          cache-from: type=gha
