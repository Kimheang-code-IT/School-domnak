# =============================================================================
# CD — Build on GitHub, deploy full stack to Hostinger VPS K3s (devops-lab branch)
#
# Stack: frontend + backend + postgres + redis on K3s
# Postgres NodePort 30432 — connect from local DB tools after firewall setup
# =============================================================================
name: CD Deploy to Hostinger K3s

on:
  push:
    branches:
      - devops-lab
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  REGISTRY: ghcr.io
  PUBLIC_SITE_URL: https://school.72-62-250-194.sslip.io

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-hostinger-k3s
  cancel-in-progress: false

jobs:
  build-and-push:
    name: Build images and push to GHCR
    runs-on: ubuntu-latest

    outputs:
      frontend_sha: ${{ steps.image.outputs.frontend_sha }}
      frontend_latest: ${{ steps.image.outputs.frontend_latest }}
      backend_sha: ${{ steps.image.outputs.backend_sha }}
      backend_latest: ${{ steps.image.outputs.backend_latest }}

    steps:
      - name: Checkout (GitHub runner only — never copied to VPS)
        uses: actions/checkout@v6

      - name: Set image names (GHCR requires lowercase)
        id: image
        env:
          REGISTRY: ghcr.io
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          REPO_NAME: ${{ github.event.repository.name }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          OWNER_LC=$(echo "${GHCR_USERNAME}" | tr '[:upper:]' '[:lower:]')
          REPO_LC=$(echo "${REPO_NAME}" | tr '[:upper:]' '[:lower:]')
          echo "frontend_sha=${REGISTRY}/${OWNER_LC}/${REPO_LC}:${COMMIT_SHA}" >> "$GITHUB_OUTPUT"
          echo "frontend_latest=${REGISTRY}/${OWNER_LC}/${REPO_LC}:latest" >> "$GITHUB_OUTPUT"
          echo "backend_sha=${REGISTRY}/${OWNER_LC}/${REPO_LC}-backend:${COMMIT_SHA}" >> "$GITHUB_OUTPUT"
          echo "backend_latest=${REGISTRY}/${OWNER_LC}/${REPO_LC}-backend:latest" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.GHCR_USERNAME }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v7
        with:
          context: ./Frontend
          file: ./Frontend/Dockerfile
          target: runtime
          push: true
          provenance: false
          tags: |
            ${{ steps.image.outputs.frontend_sha }}
            ${{ steps.image.outputs.frontend_latest }}
          build-args: |
            NUXT_PUBLIC_API_BASE=${{ env.PUBLIC_SITE_URL }}/api/v1
            NUXT_PUBLIC_USE_BACKEND_API=true
          cache-from: type=gha

      - name: Build and push backend image
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          provenance: false
          tags: |
            ${{ steps.image.outputs.backend_sha }}
            ${{ steps.image.outputs.backend_latest }}
          cache-from: type=gha

  deploy:
    name: Deploy full stack to Hostinger VPS (SSH only)
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Deploy stack on VPS (SSH only — no SCP, manual nginx)
        uses: appleboy/ssh-action@v1.2.5
        env:
          FRONTEND_IMAGE: ${{ needs.build-and-push.outputs.frontend_sha }}
          BACKEND_IMAGE: ${{ needs.build-and-push.outputs.backend_sha }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          timeout: 120s
          command_timeout: 15m
          envs: FRONTEND_IMAGE,BACKEND_IMAGE,GHCR_USERNAME,GHCR_TOKEN
          script: |
            set -euo pipefail

            echo "==> VPS: full stack deploy (frontend + backend + postgres + redis)"
            echo "==> Nginx on Ubuntu is configured manually — not by CD"

            GHCR_USER_LC=$(echo "${GHCR_USERNAME}" | tr '[:upper:]' '[:lower:]')
            K8S_DIR="/opt/devops-runtime/k8s"
            DEPLOY_SCRIPT="/opt/devops-runtime/scripts/deploy-image.sh"
            APPLY_SCRIPT="/opt/devops-runtime/scripts/apply-k8s-stack.sh"

            kubectl() {
              if command -v k3s >/dev/null 2>&1; then
                k3s kubectl --request-timeout=120s "$@"
              else
                kubectl --request-timeout=120s "$@"
              fi
            }

            export KUBECONFIG="${KUBECONFIG:-/etc/rancher/k3s/k3s.yaml}"

            if [[ ! -x "${DEPLOY_SCRIPT}" ]]; then
              echo "ERROR: ${DEPLOY_SCRIPT} missing."
              echo "Copy once from your PC (see docs/k3s-setup.md)"
              exit 1
            fi

            if [[ -x "${APPLY_SCRIPT}" ]]; then
              "${APPLY_SCRIPT}"
            elif [[ -d "${K8S_DIR}" ]]; then
              echo "==> Apply k8s manifests from ${K8S_DIR}..."
              for f in namespace.yaml postgres.yaml redis.yaml backend.yaml deployment.yaml service.yaml; do
                [[ -f "${K8S_DIR}/${f}" ]] && kubectl apply -f "${K8S_DIR}/${f}" || true
              done
            fi

            if ! kubectl get secret school-domnak-secrets -n devops-lab >/dev/null 2>&1; then
              echo "ERROR: Secret school-domnak-secrets missing in devops-lab."
              echo "Create once on VPS from k8s/secret.example.yaml (see docs/k3s-setup.md)."
              exit 1
            fi

            echo "==> GHCR pull secret..."
            kubectl create namespace devops-lab --dry-run=client -o yaml | kubectl apply -f -
            kubectl delete secret ghcr-secret -n devops-lab --ignore-not-found
            kubectl create secret docker-registry ghcr-secret \
              --namespace=devops-lab \
              --docker-server=ghcr.io \
              --docker-username="${GHCR_USER_LC}" \
              --docker-password="${GHCR_TOKEN}"

            echo "==> Deploy images:"
            echo "    frontend: ${FRONTEND_IMAGE}"
            echo "    backend:  ${BACKEND_IMAGE}"
            "${DEPLOY_SCRIPT}" "${FRONTEND_IMAGE}" "${BACKEND_IMAGE}"

            echo "==> Done."
