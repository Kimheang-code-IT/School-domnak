# =============================================================================
# CD — Build on GitHub, deploy to Hostinger VPS K3s (devops-lab branch)
#
# Runs on every push to devops-lab (+ manual trigger).
# CI (SchoolDomnak CI) runs in parallel for tests.
# =============================================================================
name: CD Deploy to Hostinger K3s

on:
  push:
    branches:
      - devops-lab
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  REGISTRY: ghcr.io

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-hostinger-k3s
  cancel-in-progress: false

jobs:
  build-and-push:
    name: Build image and push to GHCR
    runs-on: ubuntu-latest

    outputs:
      image_sha: ${{ steps.image.outputs.image_sha }}
      image_latest: ${{ steps.image.outputs.image_latest }}

    steps:
      - name: Checkout (GitHub runner only — never copied to VPS)
        uses: actions/checkout@v6

      - name: Set image name (GHCR requires lowercase)
        id: image
        env:
          REGISTRY: ghcr.io
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          REPO_NAME: ${{ github.event.repository.name }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          OWNER_LC=$(echo "${GHCR_USERNAME}" | tr '[:upper:]' '[:lower:]')
          REPO_LC=$(echo "${REPO_NAME}" | tr '[:upper:]' '[:lower:]')
          echo "image_sha=${REGISTRY}/${OWNER_LC}/${REPO_LC}:${COMMIT_SHA}" >> "$GITHUB_OUTPUT"
          echo "image_latest=${REGISTRY}/${OWNER_LC}/${REPO_LC}:latest" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.GHCR_USERNAME }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: ./Frontend
          file: ./Frontend/Dockerfile
          target: runtime
          push: true
          provenance: false
          tags: |
            ${{ steps.image.outputs.image_sha }}
            ${{ steps.image.outputs.image_latest }}
          build-args: |
            NUXT_PUBLIC_API_BASE=http://${{ secrets.VPS_HOST }}/api/v1
            NUXT_PUBLIC_USE_BACKEND_API=true
          cache-from: type=gha

  deploy:
    name: Deploy to Hostinger VPS (kubectl only)
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Checkout (runner only — YAML + script, no app source)
        uses: actions/checkout@v6

      - name: Sync deploy assets to VPS (YAML + script only)
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          source: "scripts/deploy-image.sh,k8s/namespace.yaml,k8s/deployment.yaml,k8s/service.yaml"
          target: "/tmp/school-domnak-deploy"
          strip_components: 0
          overwrite: true

      - name: Deploy new image on VPS
        uses: appleboy/ssh-action@v1.2.5
        env:
          IMAGE_SHA: ${{ needs.build-and-push.outputs.image_sha }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          command_timeout: 15m
          envs: IMAGE_SHA,GHCR_USERNAME,GHCR_TOKEN
          script: |
            set -euo pipefail

            echo "==> VPS: containers only — no git, no docker build, no source code"

            GHCR_USER_LC=$(echo "${GHCR_USERNAME}" | tr '[:upper:]' '[:lower:]')
            DEPLOY_DIR="/tmp/school-domnak-deploy"

            kubectl() {
              if command -v k3s >/dev/null 2>&1; then
                k3s kubectl --request-timeout=120s "$@"
              else
                kubectl --request-timeout=120s "$@"
              fi
            }

            export KUBECONFIG="${KUBECONFIG:-/etc/rancher/k3s/k3s.yaml}"

            echo "==> Install deploy script..."
            mkdir -p /opt/devops-runtime/scripts
            install -m 755 "${DEPLOY_DIR}/scripts/deploy-image.sh" /opt/devops-runtime/scripts/deploy-image.sh

            echo "==> Apply Kubernetes manifests (YAML only)..."
            kubectl apply -f "${DEPLOY_DIR}/k8s/namespace.yaml"
            kubectl apply -f "${DEPLOY_DIR}/k8s/deployment.yaml"
            kubectl apply -f "${DEPLOY_DIR}/k8s/service.yaml"

            echo "==> GHCR pull secret (private images)..."
            kubectl delete secret ghcr-secret -n devops-lab --ignore-not-found
            kubectl create secret docker-registry ghcr-secret \
              --namespace=devops-lab \
              --docker-server=ghcr.io \
              --docker-username="${GHCR_USER_LC}" \
              --docker-password="${GHCR_TOKEN}"

            kubectl patch serviceaccount default \
              -n devops-lab \
              -p '{"imagePullSecrets":[{"name":"ghcr-secret"}]}' \
              --type=merge

            echo "==> Update running deployment to new image..."
            /opt/devops-runtime/scripts/deploy-image.sh "${IMAGE_SHA}"

            rm -rf "${DEPLOY_DIR}"
            echo "==> Done. Host nginx is configured manually on VPS (see docs/k3s-setup.md)."
