# =============================================================================
# CD — Build on GitHub, deploy to Hostinger VPS K3s (devops-lab branch)
#
# Runs on every push to devops-lab (+ manual trigger).
# CI (SchoolDomnak CI) runs in parallel for tests.
# =============================================================================
name: CD Deploy to Hostinger K3s

on:
  push:
    branches:
      - devops-lab
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  REGISTRY: ghcr.io

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-hostinger-k3s
  cancel-in-progress: false

jobs:
  build-and-push:
    name: Build image and push to GHCR
    runs-on: ubuntu-latest

    outputs:
      image_sha: ${{ steps.image.outputs.image_sha }}
      image_latest: ${{ steps.image.outputs.image_latest }}

    steps:
      - name: Checkout (GitHub runner only — never copied to VPS)
        uses: actions/checkout@v6

      - name: Set image name (GHCR requires lowercase)
        id: image
        env:
          REGISTRY: ghcr.io
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          REPO_NAME: ${{ github.event.repository.name }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          OWNER_LC=$(echo "${GHCR_USERNAME}" | tr '[:upper:]' '[:lower:]')
          REPO_LC=$(echo "${REPO_NAME}" | tr '[:upper:]' '[:lower:]')
          echo "image_sha=${REGISTRY}/${OWNER_LC}/${REPO_LC}:${COMMIT_SHA}" >> "$GITHUB_OUTPUT"
          echo "image_latest=${REGISTRY}/${OWNER_LC}/${REPO_LC}:latest" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.GHCR_USERNAME }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: ./Frontend
          file: ./Frontend/Dockerfile
          target: runtime
          push: true
          provenance: false
          tags: |
            ${{ steps.image.outputs.image_sha }}
            ${{ steps.image.outputs.image_latest }}
          build-args: |
            NUXT_PUBLIC_API_BASE=http://${{ secrets.VPS_HOST }}/api/v1
            NUXT_PUBLIC_USE_BACKEND_API=true
          cache-from: type=gha

  deploy:
    name: Deploy to Hostinger VPS (SSH only)
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Deploy new image on VPS (SSH only — no SCP, manual nginx)
        uses: appleboy/ssh-action@v1.2.5
        env:
          IMAGE_SHA: ${{ needs.build-and-push.outputs.image_sha }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          timeout: 120s
          command_timeout: 15m
          envs: IMAGE_SHA,GHCR_USERNAME,GHCR_TOKEN
          script: |
            set -euo pipefail

            echo "==> VPS: kubectl + deploy-image.sh only (no source code, no SCP)"
            echo "==> Nginx on Ubuntu is configured manually — not by CD"

            GHCR_USER_LC=$(echo "${GHCR_USERNAME}" | tr '[:upper:]' '[:lower:]')
            K8S_DIR="/opt/devops-runtime/k8s"
            DEPLOY_SCRIPT="/opt/devops-runtime/scripts/deploy-image.sh"

            kubectl() {
              if command -v k3s >/dev/null 2>&1; then
                k3s kubectl --request-timeout=120s "$@"
              else
                kubectl --request-timeout=120s "$@"
              fi
            }

            export KUBECONFIG="${KUBECONFIG:-/etc/rancher/k3s/k3s.yaml}"

            if [[ ! -x "${DEPLOY_SCRIPT}" ]]; then
              echo "ERROR: ${DEPLOY_SCRIPT} missing."
              echo "Copy once from your PC (see docs/k3s-setup.md):"
              echo "  scp scripts/deploy-image.sh root@VPS:/opt/devops-runtime/scripts/"
              exit 1
            fi

            if [[ -d "${K8S_DIR}" ]]; then
              echo "==> Apply k8s manifests from ${K8S_DIR} (if present)..."
              kubectl apply -f "${K8S_DIR}/namespace.yaml" 2>/dev/null || true
              kubectl apply -f "${K8S_DIR}/deployment.yaml" 2>/dev/null || true
              kubectl apply -f "${K8S_DIR}/service.yaml" 2>/dev/null || true
            fi

            echo "==> GHCR pull secret..."
            kubectl create namespace devops-lab --dry-run=client -o yaml | kubectl apply -f -
            kubectl delete secret ghcr-secret -n devops-lab --ignore-not-found
            kubectl create secret docker-registry ghcr-secret \
              --namespace=devops-lab \
              --docker-server=ghcr.io \
              --docker-username="${GHCR_USER_LC}" \
              --docker-password="${GHCR_TOKEN}"

            echo "==> Deploy image: ${IMAGE_SHA}"
            "${DEPLOY_SCRIPT}" "${IMAGE_SHA}"

            echo "==> Done."
