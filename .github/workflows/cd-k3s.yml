# =============================================================================
# CD — Build on GitHub, deploy full stack to Hostinger VPS K3s (devops-lab branch)
# VPS setup is manual — see docs/VPS-MANUAL-SETUP.md
# =============================================================================
name: CD Deploy to Hostinger K3s

on:
  push:
    branches:
      - devops-lab
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  REGISTRY: ghcr.io
  PUBLIC_SITE_URL: https://school.72-62-250-194.sslip.io

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-hostinger-k3s
  cancel-in-progress: false

jobs:
  build-and-push:
    name: Build images and push to GHCR
    runs-on: ubuntu-latest

    outputs:
      frontend_sha: ${{ steps.image.outputs.frontend_sha }}
      frontend_latest: ${{ steps.image.outputs.frontend_latest }}
      backend_sha: ${{ steps.image.outputs.backend_sha }}
      backend_latest: ${{ steps.image.outputs.backend_latest }}

    steps:
      - name: Checkout (GitHub runner only — never copied to VPS)
        uses: actions/checkout@v6

      - name: Set image names (GHCR requires lowercase)
        id: image
        env:
          REGISTRY: ghcr.io
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          REPO_NAME: ${{ github.event.repository.name }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          OWNER_LC=$(echo "${GHCR_USERNAME}" | tr '[:upper:]' '[:lower:]')
          REPO_LC=$(echo "${REPO_NAME}" | tr '[:upper:]' '[:lower:]')
          echo "frontend_sha=${REGISTRY}/${OWNER_LC}/${REPO_LC}:${COMMIT_SHA}" >> "$GITHUB_OUTPUT"
          echo "frontend_latest=${REGISTRY}/${OWNER_LC}/${REPO_LC}:latest" >> "$GITHUB_OUTPUT"
          echo "backend_sha=${REGISTRY}/${OWNER_LC}/${REPO_LC}-backend:${COMMIT_SHA}" >> "$GITHUB_OUTPUT"
          echo "backend_latest=${REGISTRY}/${OWNER_LC}/${REPO_LC}-backend:latest" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.GHCR_USERNAME }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v7
        with:
          context: ./Frontend
          file: ./Frontend/Dockerfile
          target: runtime
          push: true
          provenance: false
          tags: |
            ${{ steps.image.outputs.frontend_sha }}
            ${{ steps.image.outputs.frontend_latest }}
          build-args: |
            NUXT_PUBLIC_API_BASE=${{ env.PUBLIC_SITE_URL }}/api/v1
            NUXT_PUBLIC_USE_BACKEND_API=true
          cache-from: type=gha

      - name: Build and push backend image
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          provenance: false
          tags: |
            ${{ steps.image.outputs.backend_sha }}
            ${{ steps.image.outputs.backend_latest }}
          cache-from: type=gha

  deploy:
    name: Deploy full stack to Hostinger VPS (SSH only)
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Deploy via kubectl on VPS (no shell scripts on VPS)
        uses: appleboy/ssh-action@v1.2.5
        env:
          FRONTEND_IMAGE: ${{ needs.build-and-push.outputs.frontend_sha }}
          BACKEND_IMAGE: ${{ needs.build-and-push.outputs.backend_sha }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          timeout: 120s
          command_timeout: 8m
          envs: FRONTEND_IMAGE,BACKEND_IMAGE,GHCR_USERNAME,GHCR_TOKEN
          script: |
            set -euo pipefail

            GHCR_USER_LC=$(echo "${GHCR_USERNAME}" | tr '[:upper:]' '[:lower:]')
            K8S_DIR="/opt/devops-runtime/k8s"
            NAMESPACE="devops-lab"

            kubectl() {
              if command -v k3s >/dev/null 2>&1; then
                k3s kubectl --request-timeout=120s "$@"
              else
                kubectl --request-timeout=120s "$@"
              fi
            }

            export KUBECONFIG="${KUBECONFIG:-/etc/rancher/k3s/k3s.yaml}"

            if ! kubectl get secret school-domnak-secrets -n "${NAMESPACE}" >/dev/null 2>&1; then
              echo "ERROR: Secret school-domnak-secrets missing."
              echo "Create manually — see docs/VPS-MANUAL-SETUP.md"
              exit 1
            fi

            DB_URL="$(kubectl get secret school-domnak-secrets -n "${NAMESPACE}" -o jsonpath='{.data.DATABASE_URL}' | base64 -d)"
            if echo "${DB_URL}" | grep -qE 'REPLACE_|\$@postgres|\$\{'; then
              echo "ERROR: Invalid DATABASE_URL in secret (fix on VPS before CD can succeed):"
              echo "  ${DB_URL}"
              echo "See docs/VPS-MANUAL-SETUP.md"
              exit 1
            fi
            if ! echo "${DB_URL}" | grep -q '@postgres:5432/'; then
              echo "ERROR: DATABASE_URL must use host postgres:5432 inside K3s:"
              echo "  ${DB_URL}"
              exit 1
            fi

            echo "==> Apply Kubernetes manifests..."
            kubectl apply -f "${K8S_DIR}/namespace.yaml"
            kubectl apply -f "${K8S_DIR}/postgres.yaml"
            kubectl apply -f "${K8S_DIR}/redis.yaml"
            kubectl wait --for=condition=ready pod -l app=postgres -n "${NAMESPACE}" --timeout=120s
            kubectl wait --for=condition=ready pod -l app=redis -n "${NAMESPACE}" --timeout=60s
            kubectl apply -f "${K8S_DIR}/backend.yaml"
            kubectl apply -f "${K8S_DIR}/deployment.yaml"
            kubectl apply -f "${K8S_DIR}/service.yaml"

            echo "==> GHCR pull secret..."
            kubectl create namespace "${NAMESPACE}" --dry-run=client -o yaml | kubectl apply -f -
            kubectl delete secret ghcr-secret -n "${NAMESPACE}" --ignore-not-found
            kubectl create secret docker-registry ghcr-secret \
              --namespace="${NAMESPACE}" \
              --docker-server=ghcr.io \
              --docker-username="${GHCR_USER_LC}" \
              --docker-password="${GHCR_TOKEN}"

            echo "==> Update images..."
            echo "    frontend: ${FRONTEND_IMAGE}"
            echo "    backend:  ${BACKEND_IMAGE}"
            kubectl set image "deployment/devops-app" "devops-app=${FRONTEND_IMAGE}" -n "${NAMESPACE}"
            kubectl set image "deployment/backend" "backend=${BACKEND_IMAGE}" -n "${NAMESPACE}"

            echo "==> Wait for frontend rollout (max 3 min)..."
            kubectl rollout status "deployment/devops-app" -n "${NAMESPACE}" --timeout=180s

            echo "==> Wait for backend rollout (max 2 min)..."
            if ! kubectl rollout status "deployment/backend" -n "${NAMESPACE}" --timeout=120s; then
              echo ""
              echo "ERROR: Backend did not become ready."
              kubectl get pods -n "${NAMESPACE}" -l app=backend
              kubectl logs -n "${NAMESPACE}" -l app=backend -c backend --tail=40 || true
              echo ""
              echo "Fix on VPS:"
              echo "  nano /opt/devops-runtime/k8s/secret.yaml"
              echo "  kubectl apply -f /opt/devops-runtime/k8s/secret.yaml"
              echo "  kubectl delete pod -n devops-lab -l app=backend"
              exit 1
            fi

            kubectl get pods,svc -n "${NAMESPACE}"
            echo "==> Done."
