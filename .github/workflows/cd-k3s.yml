name: CD Deploy to K3s on EC2

on:
  push:
    branches:
      - devops-lab

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  REGISTRY: ghcr.io

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-k3s-devops-lab
  cancel-in-progress: false

jobs:
  build-and-push:
    name: Build images and push to GHCR
    runs-on: ubuntu-latest

    outputs:
      image_owner: ${{ steps.meta.outputs.owner }}
      backend_image: ${{ steps.meta.outputs.backend_image }}
      frontend_image: ${{ steps.meta.outputs.frontend_image }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set image metadata
        id: meta
        run: |
          OWNER_LC=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "owner=${OWNER_LC}" >> "$GITHUB_OUTPUT"
          echo "backend_image=ghcr.io/${OWNER_LC}/school-domnak-backend" >> "$GITHUB_OUTPUT"
          echo "frontend_image=ghcr.io/${OWNER_LC}/school-domnak-frontend" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          push: true
          tags: |
            ghcr.io/${{ steps.meta.outputs.owner }}/school-domnak-backend:${{ github.sha }}
            ghcr.io/${{ steps.meta.outputs.owner }}/school-domnak-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push frontend
        uses: docker/build-push-action@v7
        with:
          context: ./Frontend
          push: true
          tags: |
            ghcr.io/${{ steps.meta.outputs.owner }}/school-domnak-frontend:${{ github.sha }}
            ghcr.io/${{ steps.meta.outputs.owner }}/school-domnak-frontend:latest
          build-args: |
            NUXT_PUBLIC_API_BASE=http://${{ secrets.AWS_HOST }}:30080/api/v1
            NUXT_PUBLIC_USE_BACKEND_API=true
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to K3s on AWS EC2
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.5
        env:
          GITHUB_SHA: ${{ github.sha }}
          IMAGE_OWNER: ${{ needs.build-and-push.outputs.image_owner }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
        with:
          host: ${{ secrets.AWS_HOST }}
          username: ${{ secrets.AWS_USER }}
          key: ${{ secrets.AWS_SSH_KEY }}
          port: 22
          command_timeout: 15m
          envs: GITHUB_SHA,IMAGE_OWNER,GHCR_USERNAME,GHCR_TOKEN
          script: |
            set -euo pipefail

            APP_DIR="/home/ubuntu/school-devops-lab"
            BRANCH="devops-lab"
            BACKEND_IMAGE="ghcr.io/${IMAGE_OWNER}/school-domnak-backend:${GITHUB_SHA}"
            FRONTEND_IMAGE="ghcr.io/${IMAGE_OWNER}/school-domnak-frontend:${GITHUB_SHA}"

            cd "$APP_DIR"

            echo "==> Syncing ${BRANCH} from GitHub..."
            git fetch origin
            git checkout "$BRANCH"
            git pull origin "$BRANCH"

            echo "==> Configuring GHCR pull secret..."
            kubectl create secret docker-registry ghcr-secret \
              --namespace school-domnak \
              --docker-server=ghcr.io \
              --docker-username="${GHCR_USERNAME}" \
              --docker-password="${GHCR_TOKEN}" \
              --dry-run=client -o yaml | kubectl apply -f -

            kubectl patch serviceaccount default \
              -n school-domnak \
              -p '{"imagePullSecrets":[{"name":"ghcr-secret"}]}' \
              --type=merge

            echo "==> Applying Kubernetes manifests..."
            kubectl apply -f k8s/namespace.yaml
            kubectl apply -f k8s/postgres.yaml
            kubectl apply -f k8s/redis.yaml
            kubectl apply -f k8s/backend.yaml
            kubectl apply -f k8s/frontend.yaml

            echo "==> Updating deployments to commit images..."
            kubectl set image deployment/backend \
              backend="${BACKEND_IMAGE}" \
              -n school-domnak
            kubectl set image deployment/frontend \
              frontend="${FRONTEND_IMAGE}" \
              -n school-domnak

            echo "==> Waiting for rollout..."
            kubectl rollout status deployment/backend -n school-domnak --timeout=300s
            kubectl rollout status deployment/frontend -n school-domnak --timeout=300s

            echo "==> Pods:"
            kubectl get pods -n school-domnak

            echo "==> Services:"
            kubectl get svc -n school-domnak
