# =============================================================================
# CD — Build on GitHub Actions, deploy to Hostinger VPS K3s (no source on VPS)
# =============================================================================
name: CD Deploy to Hostinger K3s

on:
  push:
    branches:
      - devops-lab
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  REGISTRY: ghcr.io

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-hostinger-k3s
  cancel-in-progress: false

jobs:
  build-and-push:
    name: Build image and push to GHCR
    runs-on: ubuntu-latest

    outputs:
      image_sha: ${{ steps.image.outputs.image_sha }}
      image_latest: ${{ steps.image.outputs.image_latest }}

    steps:
      - name: Checkout (runner only — not copied to VPS)
        uses: actions/checkout@v6

      - name: Set image name (GHCR requires lowercase)
        id: image
        env:
          REGISTRY: ghcr.io
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          REPO_NAME: ${{ github.event.repository.name }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          REPO_LC=$(echo "${REPO_NAME}" | tr '[:upper:]' '[:lower:]')
          echo "image_sha=${REGISTRY}/${GHCR_USERNAME}/${REPO_LC}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "image_latest=${REGISTRY}/${GHCR_USERNAME}/${REPO_LC}:latest" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.GHCR_USERNAME }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: ./Frontend
          file: ./Frontend/Dockerfile
          push: true
          tags: |
            ${{ steps.image.outputs.image_sha }}
            ${{ steps.image.outputs.image_latest }}
          build-args: |
            NUXT_PUBLIC_API_BASE=http://${{ secrets.VPS_HOST }}/api/v1
            NUXT_PUBLIC_USE_BACKEND_API=true
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Hostinger VPS (kubectl only)
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Checkout (runner only — deploy script sync, no app source)
        uses: actions/checkout@v6

      - name: Sync deploy script to VPS (script only, no source code)
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          source: "scripts/deploy-image.sh"
          target: "/opt/devops-runtime/scripts"
          overwrite: true

      - name: Deploy new image on VPS
        uses: appleboy/ssh-action@v1.2.5
        env:
          IMAGE_SHA: ${{ needs.build-and-push.outputs.image_sha }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          command_timeout: 15m
          envs: IMAGE_SHA,GHCR_USERNAME,GHCR_TOKEN
          script: |
            set -euo pipefail

            echo "==> VPS runs containers only — no git clone, no docker build, no source repo"

            kubectl() {
              if command -v k3s >/dev/null 2>&1; then
                k3s kubectl --request-timeout=120s "$@"
              else
                kubectl --request-timeout=120s "$@"
              fi
            }

            export KUBECONFIG="${KUBECONFIG:-/etc/rancher/k3s/k3s.yaml}"

            echo "==> Ensure GHCR pull secret exists..."
            kubectl create namespace devops-lab --dry-run=client -o yaml | kubectl apply -f -
            kubectl create secret docker-registry ghcr-secret \
              --namespace=devops-lab \
              --docker-server=ghcr.io \
              --docker-username="${GHCR_USERNAME}" \
              --docker-password="${GHCR_TOKEN}" \
              --dry-run=client -o yaml | kubectl apply -f -

            chmod +x /opt/devops-runtime/scripts/deploy-image.sh
            /opt/devops-runtime/scripts/deploy-image.sh "${IMAGE_SHA}"
