name: CD Deploy to AWS

on:
  push:
    branches:
      - devops-lab

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: deploy-devops-lab
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy devops-lab branch to AWS EC2
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to AWS EC2 by SSH
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.AWS_HOST }}
          username: ${{ secrets.AWS_USER }}
          key: ${{ secrets.AWS_SSH_KEY }}
          port: 22
          command_timeout: 45m
          script: |
            set -euo pipefail

            APP_DIR="/home/ubuntu/school-devops-lab"
            BRANCH="devops-lab"

            cd "$APP_DIR"

            echo "==> Syncing $BRANCH from GitHub..."
            git fetch origin
            git checkout "$BRANCH"
            git reset --hard "origin/$BRANCH"

            echo "==> Building frontend static assets for Nginx..."
            rm -rf Frontend/dist
            docker buildx build \
              -f Frontend/Dockerfile \
              --target export \
              --output type=local,dest=./Frontend/dist \
              Frontend

            echo "==> Restarting Docker stack..."
            docker compose down
            docker compose up -d --build

            echo "==> Waiting for backend health..."
            for i in $(seq 1 36); do
              if curl -sf http://localhost:18000/health >/dev/null; then
                echo "Backend is healthy"
                break
              fi
              if [ "$i" -eq 36 ]; then
                echo "Backend health check timed out"
                docker compose logs --tail=80 backend
                exit 1
              fi
              sleep 5
            done

            echo "==> Running containers:"
            docker compose ps
