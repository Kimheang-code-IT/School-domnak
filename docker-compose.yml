services:
  postgres:
    image: postgres:16-alpine
    container_name: school-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-school_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "15432:5432"
    volumes:
      - school_postgres_data:/var/lib/postgresql/data
    networks:
      - school_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-school_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: school-redis
    ports:
      - "16379:6379"
    networks:
      - school_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    container_name: school-backend
    env_file:
      - .env
    environment:
      RUN_DB_MIGRATIONS: "true"
    ports:
      - "18000:8000"
    volumes:
      - ./secrets:/app/secrets:ro
      - ./uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - school_network
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')\""]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 40s

  celery_worker:
    build:
      context: ./backend
    container_name: school-celery-worker
    env_file:
      - .env
    environment:
      RUN_DB_MIGRATIONS: "false"
    volumes:
      - ./secrets:/app/secrets:ro
      - ./uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_started
    networks:
      - school_network
    command: celery -A app.core.celery_app.celery_app worker --loglevel=info

  celery_beat:
    build:
      context: ./backend
    container_name: school-celery-beat
    env_file:
      - .env
    environment:
      RUN_DB_MIGRATIONS: "false"
    volumes:
      - ./secrets:/app/secrets:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - school_network
    command: celery -A app.core.celery_app.celery_app beat --loglevel=info

  nginx:
    image: nginx:1.27-alpine
    container_name: school-nginx
    ports:
      - "18080:80"
      - "18443:443"
    volumes:
      - ./Frontend/dist:/usr/share/nginx/html:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./uploads:/app/uploads:ro
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - school_network
    restart: unless-stopped

networks:
  school_network:
    name: school_network
    driver: bridge

volumes:
  school_postgres_data:
    name: school_postgres_data
