# Ubuntu host nginx — public entry point (port 80)
# Proxies to K3s NodePort (app runs in pod, not exposed directly on :80)
#
# Install path on VPS: /etc/nginx/sites-available/devops-k3s

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    client_max_body_size 25m;

    access_log /var/log/nginx/devops-k3s-access.log;
    error_log /var/log/nginx/devops-k3s-error.log;

    location / {
        proxy_pass http://127.0.0.1:30000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
    }
}
