# Ubuntu host nginx — HTTPS public entry (school.72-62-250-194.sslip.io)
#   /        → K3s frontend NodePort 30000
#   /api/    → K3s backend NodePort 30080
#
# SSL cert (create once): /opt/devops-runtime/scripts/setup-ssl-self-signed.sh
# Install path on VPS: /etc/nginx/sites-available/devops-k3s

# HTTP → HTTPS redirect
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name school.72-62-250-194.sslip.io 72.62.250.194 _;

    return 301 https://school.72-62-250-194.sslip.io$request_uri;
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    http2 on;
    server_name school.72-62-250-194.sslip.io;

    ssl_certificate     /etc/nginx/ssl/school-domnak.crt;
    ssl_certificate_key /etc/nginx/ssl/school-domnak.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    client_max_body_size 25m;

    access_log /var/log/nginx/devops-k3s-access.log;
    error_log /var/log/nginx/devops-k3s-error.log;

    location /api/ {
        proxy_pass http://127.0.0.1:30080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
    }

    location /docs {
        proxy_pass http://127.0.0.1:30080/docs;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /openapi.json {
        proxy_pass http://127.0.0.1:30080/openapi.json;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /health {
        proxy_pass http://127.0.0.1:30080/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:30000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
    }
}
